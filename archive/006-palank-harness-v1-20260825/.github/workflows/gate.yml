name: harness-gate

# Trust Boundary: local infinite-loop verifies logic, this Clean Room verifies honesty.
# PR-only Lite — preserves Thin/Disposable principle (AGENTS.md:56). No setup-node required.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for Fingerprint git cat-file -e <hash> drift checks (SPEC.md:4.5, scripts/check_vault.js:100)

      - name: lint (syntax gate)
        run: npm run lint --silent
        # checks: opencode.json JSON + node --check mcp/server.js scripts/check_vault.js scripts/migrate.js bin/cli.js

      - name: vault (evidence + drift gate)
        run: node scripts/check_vault.js --strict .
        # 0 errors, 0 suspects required. skeleton wiki 0 && index 0 → PASS (SPEC.md:4, scripts/check_vault.js:59)
        # verifies: index parity, Raw: citations, Fingerprint drift

      - name: pack hygiene
        run: npm pack --dry-run 2>&1 | grep -q "__pycache__" && echo "::error::pack leaks __pycache__" && exit 1 || echo "pack clean"
